<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NeoChat UI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f4f6;
}

/* Layout */
.container {
    display: flex;
    height: 100vh;
}

/* Sidebar */
.sidebar {
    width: 250px;
    background: #f9fafb;
    padding: 20px;
    border-right: 1px solid #e5e7eb;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    color: #7c3aed;
    margin-bottom: 20px;
}

.new-chat {
    background: linear-gradient(45deg, #7c3aed, #9333ea);
    color: white;
    border: none;
    padding: 12px;
    width: 100%;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 20px;
}

.chat-history {
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 10px;
}

.chat-item {
    padding: 10px;
    border-radius: 8px;
    background: #ede9fe;
    cursor: pointer;
    margin: 10px;
}

/* Main Chat */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.header {
    padding: 15px 20px;
    border-bottom: 1px solid #e5e7eb;
    font-weight: bold;
}

.chat-area {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

/* Messages */
.message {
    margin-bottom: 15px;
    max-width: 60%;
    padding: 10px;
    border-radius: 10px;
}

.user {
    background: #7c3aed;
    color: white;
    margin-left: auto;
}

.bot {
    background: #e5e7eb;
}

/* Input */
.input-area {
    padding: 15px;
    border-top: 1px solid #e5e7eb;
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
}

button.send {
    background: #7c3aed;
    color: white;
    border: none;
    padding: 0 18px;
    border-radius: 10px;
    cursor: pointer;
}

</style>

<style>
.loader {
    display: flex;
    gap: 5px;
    padding: 10px;
    background: #e5e7eb;
    border-radius: 10px;
    width: fit-content;
}

.dot {
    width: 6px;
    height: 6px;
    background: #555;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
}

.dot:nth-child(2) {
    animation-delay: 0.2s;
}
.dot:nth-child(3) {
    animation-delay: 0.4s;
}

@keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">MyAI</div>

        <!-- ✅ ADDED -->
        <button onclick="login()" id="loginBtn">Login with Google</button>
        <button onclick="logout()" id="logoutBtn" style="display:none;">Logout</button>
        <div id="userInfo"></div>

        <button class="new-chat">+ New Chat</button>

        <div class="chat-history">Chat History</div>
        <!-- <div class="chat-item">New Conversation</div> -->
    </div>

    <!-- Main Chat -->
    <div class="main">
        <div class="header">My AI</div>

        <div class="chat-area" id="chatArea"></div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your message here...">
            <button class="send" onclick="sendRequest()">➤</button>
        </div>
    </div>

</div>

<script>
document.getElementById("userInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendRequest();
    }
});

let allChats = {};
let currentChatId = null;
let currentUser = null;

/* 🔹 USER STORAGE */
function getStorageKey() {
    return currentUser ? "chat_" + currentUser.uid : "chat_guest";
}

function loadChats() {
    allChats = JSON.parse(localStorage.getItem(getStorageKey())) || {};
}

function saveChats() {
    localStorage.setItem(getStorageKey(), JSON.stringify(allChats));
}

/* 🔹 Create Chat */
function createNewChat() {
    currentChatId = "chat_" + Date.now();

    allChats[currentChatId] = [];
    saveChats();

    document.getElementById("chatArea").innerHTML = "";
    renderChatHistory();
}

/* 🔹 History */
function renderChatHistory() {
    const container = document.querySelector(".chat-history");
    container.innerHTML = "<div style='margin-bottom:10px;'>Chat History</div>";

    Object.keys(allChats).forEach(id => {

        let messages = allChats[id];
        if (messages.length === 0) return;

        let firstMsg = messages[0].content.split(" ").slice(0, 10).join(" ");

        let div = document.createElement("div");
        div.className = "chat-item";
        div.innerText = firstMsg;

        div.onclick = () => loadChat(id);

        container.appendChild(div);
    });
}

/* 🔹 Load Chat */
function loadChat(id) {
    currentChatId = id;

    const chatArea = document.getElementById("chatArea");
    chatArea.innerHTML = "";

    allChats[id].forEach(msg => {
        appendMessage(msg.content, msg.role === "user" ? "user" : "bot");
    });
}

/* 🔹 UI */
function appendMessage(text, type) {
    const div = document.createElement("div");
    div.classList.add("message", type);
    div.innerText = text;

    document.getElementById("chatArea").appendChild(div);
    div.scrollIntoView();
}

/* 🔹 SEND */
function sendRequest() {

    const input = document.getElementById("userInput");
    const userMessage = input.value;

    if (!userMessage) return;

    if (!currentChatId) createNewChat();

    appendMessage(userMessage, "user");

    allChats[currentChatId].push({
        role: "user",
        content: userMessage
    });

    saveChats();
    input.value = "";

    showLoader();

    fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-goog-api-key': 'AIzaSyD37J2nQTbOxNErqA63lC5pP2Zq8HU75BY'
        },
        body: JSON.stringify({
            contents: [
                {
                    role: "user",
                    parts: [
                        {
                            text: `
You are a custom AI assistant created by Suraj.

RULES:
- If user asks identity → reply in SAME LANGUAGE
- English → "I am a personal AI assistant created by Suraj."
- Hindi → "Main Suraj dwara banaya gaya ek personal AI assistant hoon."
- Never say Gemini

User: ${userMessage}
                            `
                        }
                    ]
                }
            ]
        })
    })
    .then(res => res.json())
    .then(res => {

        removeLoader();

        const content = res.candidates?.[0]?.content?.parts?.[0]?.text || "Error";

        appendMessage(content, "bot");

        allChats[currentChatId].push({
            role: "assistant",
            content: content
        });

        saveChats();
        renderChatHistory();
    })
    .catch(err => {
        removeLoader();
        appendMessage("Error", "bot");
    });
}

/* 🔹 INIT */
document.querySelector(".new-chat").onclick = createNewChat;

loadChats();
renderChatHistory();
</script>

<!-- 🔥 FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDR3m7GNxd4HYZYCqAG_wjaWTLiX_8jcK8",
  authDomain: "myai-ad07d.firebaseapp.com",
  projectId: "myai-ad07d",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

window.login = function() {
  signInWithPopup(auth, provider);
};

window.logout = function() {
  signOut(auth);
};

onAuthStateChanged(auth, (user) => {
  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const userInfo = document.getElementById("userInfo");

  if (user) {
    console.log("User logged in:", user.email);

    window.currentUser = user;

    // ✅ Hide login button
    loginBtn.style.display = "none";

    // ✅ Show logout button
    logoutBtn.style.display = "block";

    // ✅ Show user email
    userInfo.innerText = user.email;

  } else {
    console.log("No user");

    window.currentUser = null;

    // ❌ Show login button
    loginBtn.style.display = "block";

    // ❌ Hide logout button
    logoutBtn.style.display = "none";

    // ❌ Clear user info
    userInfo.innerText = "";
  }
});
</script>

<!-- loader script SAME -->
<script>
let loaderElement = null;

function showLoader() {
    loaderElement = document.createElement("div");
    loaderElement.classList.add("message", "bot");

    loaderElement.innerHTML = `
        <div class="loader">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    `;

    document.getElementById("chatArea").appendChild(loaderElement);
}

function removeLoader() {
    if (loaderElement) loaderElement.remove();
}
</script>

</body>
</html>
